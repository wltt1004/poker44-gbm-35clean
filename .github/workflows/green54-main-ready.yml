name: Green54 submission-ready Main

on:
  push:
    branches:
      - scratch/green54-proof-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore Lean caches
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
            .deps/formal-conjectures/.lake
          key: green54-lean-v427-fc379-mathlib-a3-v1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Unpack exact Formal Conjectures revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps/formal-conjectures
          curl -L --fail https://codeload.github.com/google-deepmind/formal-conjectures/tar.gz/379fc0298dc146df549e7061c3ede0353a5bb51f \
            | tar -xz --strip-components=1 -C .deps/formal-conjectures

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Recompile modular source proof
        shell: bash
        run: |
          set -euo pipefail
          lake build Green54Check
          mkdir -p .lake/build/lib/lean/Green54Check
          lake env lean \
            -o .lake/build/lib/lean/Green54Check/Classification.olean \
            Green54Check/Classification.lean
          lake env lean Green54Check/Arithmetic.lean
          lake env lean Green54Check/Final.lean

      - name: Generate and statically scan submission Main.lean
        run: python3 scripts/green54_prepare_submission.py

      - name: Compile exact Main under task-style trusted wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("dist/WrappedMain.lean"); s=p.read_text(encoding="utf-8"); s=s.replace("import FormalConjectures.GreensOpenProblems.«54»\n\n", "import FormalConjectures.GreensOpenProblems.«54»\n\nopen MeasureTheory ProbabilityTheory\nopen scoped Pointwise ENNReal NNReal Topology\n\n"); s=s.replace("$_source:str", "$source:str"); p.write_text(s, encoding="utf-8")'
          lake env lean dist/WrappedMain.lean 2>&1 | tee dist/LEAN_AUDIT.txt
          if grep -q sorryAx dist/LEAN_AUDIT.txt; then
            echo "Unexpected sorryAx dependency"
            exit 1
          fi

      - name: Record checksum and package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/Main.lean > dist/SHA256SUMS.txt
          cd dist
          zip -q Green54-submission-ready.zip Main.lean README.txt SHA256SUMS.txt LEAN_AUDIT.txt

      - name: Upload submission-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: Green54-submission-ready
          path: |
            dist/Main.lean
            dist/Green54-submission-ready.zip
            dist/README.txt
            dist/SHA256SUMS.txt
            dist/LEAN_AUDIT.txt
          if-no-files-found: error
          retention-days: 30
