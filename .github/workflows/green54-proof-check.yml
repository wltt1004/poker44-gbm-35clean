name: Green54 Lean proof check

on:
  push:
    branches:
      - scratch/green54-proof-check
    paths:
      - 'green54-proof-check/**'
      - '.github/workflows/green54-proof-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: green54-proof-check
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve dependencies
        working-directory: green54-proof-check
        run: lake update
      - name: Download Mathlib cache
        working-directory: green54-proof-check
        run: lake exe cache get
      - name: Build proof
        working-directory: green54-proof-check
        run: lake build Green54Check
