name: Green54 Lean proof check

on:
  push:
    branches:
      - scratch/green54-proof-check
    paths:
      - 'green54-proof-check/**'
      - '.github/workflows/green54-proof-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned formal-conjectures
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 379fc0298dc146df549e7061c3ede0353a5bb51f
          path: green54-proof-check/vendor/formal-conjectures
          fetch-depth: 1
      - name: Restore Lean and Mathlib environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            green54-proof-check/vendor/formal-conjectures/.lake/packages
          key: green54-lean427-mathlib-a3a10db0-v1
          save-always: true
      - name: Install Lean 4.27.0
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        working-directory: green54-proof-check/vendor/formal-conjectures
        run: lake exe cache get
      - name: Check proof
        working-directory: green54-proof-check/vendor/formal-conjectures
        run: lake env lean ../../Green54Check.lean
