name: Green54 Lean proof check

on:
  push:
    branches:
      - scratch/green54-proof-check
    paths:
      - 'green54-proof-check/**'
      - '.github/workflows/green54-proof-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.27.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        working-directory: green54-proof-check
        run: lake update
      - name: Download Mathlib cache
        working-directory: green54-proof-check
        run: lake exe cache get
      - name: Build proof
        working-directory: green54-proof-check
        run: lake build Green54Check
