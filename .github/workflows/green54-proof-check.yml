name: Green54 Lean proof check

on:
  push:
    branches:
      - scratch/green54-proof-check
    paths:
      - 'green54-proof-check/**'
      - '.github/workflows/green54-proof-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned formal-conjectures
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 379fc0298dc146df549e7061c3ede0353a5bb51f
          path: green54-proof-check/vendor/formal-conjectures
          fetch-depth: 1
      - name: Restore Lean and Mathlib environment
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            green54-proof-check/vendor/formal-conjectures/.lake/packages
          key: green54-lean427-mathlib-a3a10db0-v1
      - name: Install Lean 4.27.0
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        working-directory: green54-proof-check/vendor/formal-conjectures
        run: lake exe cache get
      - name: Assemble proof candidate
        working-directory: green54-proof-check/vendor/formal-conjectures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base_path = Path('../../Green54Check.lean')
          extra_path = Path('../../Green54Extra.lean')
          base = base_path.read_text()
          old = '''  have h99q : (0.99 : ℚ≥0) < 1 := by norm_num
            have h99 : (0.99 : ℝ≥0∞) < 1 := by exact_mod_cast h99q'''
          new = '''  have h99 : (0.99 : ℝ≥0∞) < 1 := by
              rw [NNRatCast.toOfScientific_def]
              norm_num'''
          if old not in base:
              raise SystemExit('expected h99 block not found')
          base = base.replace(old, new)
          Path('../../Green54Combined.lean').write_text(base + '\n' + extra_path.read_text())
          PY
      - name: Check proof
        working-directory: green54-proof-check/vendor/formal-conjectures
        run: lake env lean ../../Green54Combined.lean
      - name: Save Lean and Mathlib environment
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            green54-proof-check/vendor/formal-conjectures/.lake/packages
          key: green54-lean427-mathlib-a3a10db0-v1
