name: Green54 live Conjectures preflight

on:
  push:
    branches:
      - scratch/green54-proof-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK_ID: fc-379fc029-green54-green-54-88740a5fc0-counterexample-v1
      TASK_SHA256: sha256:09e22ab166d7bc50b5db21029a278678ac7af7246d72dfa8f5aeb8f3e238d3f7
      TEST_HOTKEY: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNQZ5HZjKX6kH
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate exact Main.lean and run local static scan
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/green54_prepare_submission.py | tee dist/local-policy.txt
          test -s dist/Main.lean

      - name: Install current official Conjectures miner CLI
        run: |
          set -euo pipefail
          python3 -m venv .conjectures-cli
          .conjectures-cli/bin/python -m pip install --upgrade pip
          .conjectures-cli/bin/pip install 'git+https://github.com/conjectures-io/conjectures-miner.git@main'
          .conjectures-cli/bin/conjectures --help >/dev/null

      - name: Capture the live allowlist
        run: |
          set -euo pipefail
          .conjectures-cli/bin/conjectures --output json tasks sync | tee dist/tasks-sync.json
          .conjectures-cli/bin/conjectures --output json tasks list --filter green54 \
            | tee dist/green54-live-tasks.json

      - name: Build canonical test bundle from the published task data
        run: |
          set -euo pipefail
          .conjectures-cli/bin/conjectures --output json build \
            --proof dist/Main.lean \
            --task "$TASK_ID" \
            --task-sha256 "$TASK_SHA256" \
            --hotkey-ss58 "$TEST_HOTKEY" \
            --output dist/preflight-submission.zip \
            --plan dist/preflight-plan.json \
            | tee dist/build.json

      - name: Capture the live validator preflight verdict
        run: |
          set +e
          .conjectures-cli/bin/conjectures --output json check \
            --plan dist/preflight-plan.json \
            > dist/live-preflight.json 2>&1
          status=$?
          set -e
          cat dist/live-preflight.json
          printf '%s\n' "$status" > dist/live-preflight.exit-code

      - name: Record proof digest and final report
        run: |
          set -euo pipefail
          sha256sum dist/Main.lean | tee dist/Main.lean.sha256
          {
            echo 'TASK_ID='$TASK_ID
            echo 'TASK_SHA256='$TASK_SHA256
            cat dist/Main.lean.sha256
            echo
            echo 'LOCAL_POLICY:'
            cat dist/local-policy.txt
            echo
            echo 'LIVE_ALLOWLIST_MATCHES:'
            cat dist/green54-live-tasks.json
            echo
            echo 'LIVE_PREFLIGHT_EXIT_CODE:'
            cat dist/live-preflight.exit-code
            echo
            echo 'LIVE_PREFLIGHT:'
            cat dist/live-preflight.json
          } > dist/SUBMISSION_AUDIT.txt

      - name: Upload Main.lean and authoritative live status
        uses: actions/upload-artifact@v4
        with:
          name: Green54-live-preflight-report
          path: |
            dist/Main.lean
            dist/Main.lean.sha256
            dist/SUBMISSION_AUDIT.txt
            dist/local-policy.txt
            dist/tasks-sync.json
            dist/green54-live-tasks.json
            dist/build.json
            dist/live-preflight.json
            dist/live-preflight.exit-code
          if-no-files-found: error
          retention-days: 30
